# Starts rjstone/plugin-marketplace's update workflow so a new release is listed within minutes
# instead of at the marketplace's next daily run. Copied from that repo's
# docs/plugin-repo-release-workflow.yml, plus a manual trigger.
#
# Runs on a release tag push (vX.Y.Z or X.Y.Z), or by hand (Actions > notify-marketplace > Run
# workflow) for a tag pushed before this workflow existed. The marketplace resolves the latest
# release tag itself; the tag sent here only labels its run.
#
# Setup in THIS repo (Settings -> Secrets and variables -> Actions):
#   - variable MARKETPLACE_APP_ID: the GitHub App's ID
#   - secret   MARKETPLACE_APP_PRIVATE_KEY: a private key (.pem) generated for that App
# The App needs only "Actions: Read and write" and is installed on the marketplace repo.
name: notify-marketplace
on:
  push:
    tags: ['v*.*.*', '[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to report (empty = the latest vX.Y.Z tag)
        required: false
        type: string

env:
  MARKETPLACE_OWNER: rjstone
  MARKETPLACE_REPO: plugin-marketplace

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Find the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name' \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          [ -n "$tag" ] || { echo "no release tag found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reporting $tag"
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          owner: ${{ env.MARKETPLACE_OWNER }}
          repositories: ${{ env.MARKETPLACE_REPO }}
      - name: Start the marketplace update workflow
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh api -X POST "repos/$MARKETPLACE_OWNER/$MARKETPLACE_REPO/actions/workflows/update.yml/dispatches" \
            -f ref=main \
            -f "inputs[repo]=${{ github.repository }}" \
            -f "inputs[tag]=$TAG"
