# On a release tag (vX.Y.Z): build that release's notes with git-cliff (cliff.toml) and publish
# a GitHub Release. The tag itself is created by the maintainer (see AGENTS.md, "Releases").
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
